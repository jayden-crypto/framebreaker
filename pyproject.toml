[project]
name = "framebreaker"
version = "0.1.0"
description = "Differential and metamorphic fuzzer for dataframe engines (Polars, pandas, DuckDB, PyArrow via Narwhals)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "narwhals>=2.26.0",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
framebreaker = "framebreaker.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]  # zips are over equal-length rows, checked explicitly where it matters

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # long report prose / one-off triage output
